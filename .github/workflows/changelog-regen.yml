---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Changelog Regen
on:
  push:
    branches: [main]
  workflow_dispatch:

# Loop guard: skip the run when the head commit is itself a
# chore(changelog) auto-sync (this workflow's own output). Without this,
# the chore(changelog) push the regen step makes would re-trigger the
# workflow on main and we'd cycle. cliff.toml's commit_parsers separately
# skip chore-changelog commits from the generated CHANGELOG body via
# `^chore.*[Cc]hangelog`, so even if the guard misfires the output stays
# stable — but the guard saves an extra workflow run.
jobs:
  regen:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(changelog)') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          # Use the default GITHUB_TOKEN so the push uses bot credentials;
          # `permissions: contents: write` above is required for it to push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up mise (for git-cliff)
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Regenerate CHANGELOG.md
        run: |
          git fetch --tags origin
          git-cliff -o CHANGELOG.md

      - name: Commit and push if changed
        run: |-
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md is up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): Auto-sync"
          git push origin HEAD:main
