---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Label PR
    if: github.event_name == 'pull_request'
    steps:
      - name: Label PR based on changed paths
        uses: actions/labeler@v6
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up mise (for just)
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Run unit tests
        run: just test-coverage

      - name: Coverage gate (per-package floor)
        run: just coverage-gate

      - name: Run e2e protocol tier
        run: just test-e2e

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: donaldgifford/booty
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: donaldgifford/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Build snapshot release with SBOMs
        uses: goreleaser/goreleaser-action@v7.1.0
        with:
          version: "~> v2"
          args: release --snapshot --skip=publish --skip=sign --clean

      # The archive name embeds the snapshot version (booty_v*-dev_linux_amd64),
      # so resolve the SBOM path instead of hardcoding it.
      - name: Locate archive SBOM
        id: sbom
        run: echo "path=$(ls dist/booty_*_linux_amd64.tar.gz.spdx.json)" >> "$GITHUB_OUTPUT"

      - name: Scan archive SBOM
        id: scan-sbom
        uses: anchore/scan-action@v7
        with:
          sbom: ${{ steps.sbom.outputs.path }}
          severity-cutoff: high
          fail-build: false
          output-format: sarif

      - name: Upload SBOM scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.35.5
        with:
          sarif_file: ${{ steps.scan-sbom.outputs.sarif }}
          category: anchore-archive-sbom

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        if: github.event_name == 'pull_request'
        uses: docker/bake-action@v7.1.0
        with:
          targets: booty-ci
          source: .
          files: docker-bake.hcl
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.output=type=registry

      - name: Scan dev image
        id: scan-image
        if: github.event_name == 'pull_request'
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/donaldgifford/booty:dev-ci
          severity-cutoff: high
          fail-build: false
          output-format: sarif

      - name: Upload image scan SARIF
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4.35.5
        with:
          sarif_file: ${{ steps.scan-image.outputs.sarif }}
          category: anchore-dev-image

      # The ci bake target is linux/amd64 only (see docker-bake.hcl) — this
      # validates the image still builds on main and warms the GHA cache.
      - name: Build CI image (post-merge validation)
        if: github.event_name == 'push'
        uses: docker/bake-action@v7.1.0
        with:
          targets: ci
          source: .
          files: docker-bake.hcl
          set: |-
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
