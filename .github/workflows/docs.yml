---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - .markdownlint.yaml
      - .github/workflows/docs.yml
      - justfile
      - mise.toml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - .markdownlint.yaml
      - .github/workflows/docs.yml
      - justfile
      - mise.toml

permissions:
  contents: read

jobs:
  lint-md:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Run markdown lint
        run: just lint-md

  # The Starlight site (DESIGN-0002) is not scaffolded yet, and every step of the
  # build below runs in a `site` directory that does not exist — so the job fails
  # on its first run step with "No such file or directory". A permanently red
  # check is worse than no check: it trains everyone to merge past CI. Gating on
  # the scaffold means the build starts running by itself the day site/ lands,
  # with no workflow edit to remember.
  detect-site:
    name: Detect site
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v6

      - id: check
        run: |
          if [ -f site/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::site/package.json not found — skipping the Starlight build (DESIGN-0002 not implemented yet)"
          fi

  build:
    name: Build Starlight
    runs-on: ubuntu-latest
    needs: detect-site
    if: needs.detect-site.outputs.present == 'true'
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise (Node)
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            site/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install deps
        run: npm ci

      - name: Type + content check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
          if-no-files-found: warn
