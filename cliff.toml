# git-cliff configuration for booty root CHANGELOG.
# https://git-cliff.org/docs/configuration
#
# Generated for the whole repo. The chart-only changelog is at
# charts/booty/cliff.toml and is invoked with
# --include-path 'charts/**'.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format is
based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and
this project adheres to [Semantic Versioning](https://semver.org/).
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

trim = true
render_always = true

postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/donaldgifford/booty" },
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
fail_on_unmatched_commit = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
use_branch_tags = false

# v0.0.0 is a baseline for pr-semver-bump, not a release — nothing was ever
# published under it. It sits at the merge commit of the pre-v0.1.0 work
# (IMPL-0001 OQ-4), so without this every commit before that point was filed
# under a version nobody can install, and v0.1.0 read as though it shipped one
# packaging fix. Ignoring the tag folds those commits into the release that
# actually carried them; skip_tags is the wrong knob here, as it discards the
# commits outright rather than reattributing them.
ignore_tags = "^v0\\.0\\.0$"

commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->Refactor" },
  { message = "^doc", group = "<!-- 3 -->Documentation" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore.*[Cc]hangelog", skip = true },
  { message = "^chore|^ci|^build", group = "<!-- 7 -->Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->Security" },
  { message = "^revert", group = "<!-- 9 -->Revert" },
  { message = ".*", group = "<!-- 10 -->Other" },
]

link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/donaldgifford/booty/issues/$1" },
]
