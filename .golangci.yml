---
# yaml-language-server: $schema=https://json.schemastore.org/golangci-lint.json
# golangci-lint configuration based on Uber's Go Style Guide
# https://github.com/uber-go/guide/blob/master/style.md
#
# Uber emphasizes:
# 1. Always check errors
# 2. Use context properly
# 3. Close resources (defer close)
# 4. Keep functions small and simple
# 5. Avoid global mutable state
# 6. Use table-driven tests
# 7. Handle errors explicitly, wrap with %w
# 8. Prefer composition over inheritance
# 9. Use functional options for configs
# 10. Document exported functions and types

version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: wd
  allow-parallel-runners: true

output:
  formats:
    tab:
      path: stdout
      colors: true

linters:
  default: none
  enable:
    # Error Handling (Critical for Uber style)
    - errcheck  # Uber: Always check returned errors
    - errorlint  # Uber: Proper error wrapping with %w
    - errchkjson  # Check JSON marshal/unmarshal errors
    - errname  # Error names should end with Error

    # Code Quality & Simplification
    - govet  # Uber: Standard Go static analysis
    - staticcheck  # Uber: SA + S (gosimple) + ST (stylecheck) via checks: all
    - unused  # Uber: Remove unused code
    - ineffassign  # Catch ineffectual assignments
    - unconvert  # Remove unnecessary type conversions

    # Performance (Uber emphasis)
    - prealloc  # Uber: Preallocate slices when size is known
    - gocritic  # Performance and style checks
    - nolintlint  # Ensure nolint directives are properly used

    # Complexity & Maintainability
    - gocyclo  # Uber: Limit cyclomatic complexity
    - gocognit  # Cognitive complexity
    - funlen  # Function length limits
    - nestif  # Deep nesting detection

    # Best Practices
    - goconst  # Uber: Use constants for repeated strings
    - misspell  # Catch spelling errors
    - nakedret  # Uber: Avoid naked returns
    - unparam  # Detect unused function parameters
    - revive  # Comprehensive linting (replaces golint)

    # Concurrency & Context (Uber emphasis)
    - contextcheck  # Uber: Proper context usage
    - noctx  # HTTP requests should use context

    # Resource Management
    - bodyclose  # Uber: Close HTTP response bodies
    - sqlclosecheck  # Uber: Close SQL resources
    - rowserrcheck  # Check sql.Rows.Err

    # Nil & Pointer Safety
    - nilerr  # Uber: Check returning nil explicitly
    - nilnil  # Simultaneous nil return values
    # - nilaway  # Nil pointer dereference detection

    # Testing
    - testifylint  # Proper use of testify assertions
    - thelper  # Test helper functions should call t.Helper()
    - tparallel  # Proper use of t.Parallel()

    # Security
    - gosec  # Security issues

    # Style & Conventions
    - godot  # Comments should end with periods
    - goheader  # License header

  settings:
    # Error handling
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close  # Common pattern to defer close
        - (net.PacketConn).Close  # Deferred close of UDP sockets; nothing actionable on failure.
        - (*os.File).Close  # Deferred close of read-only files; nothing actionable on failure.
        - io.WriteString  # HTTP response writes; the client is gone if this fails.
        - fmt.Fprint  # CLI usage output to stdout/stderr.
        - encoding/binary.Write  # Only used against in-memory buffers, which cannot fail.
        - (*github.com/fatih/color.Color).Printf  # CLI color output to stdout.
        - (*github.com/fatih/color.Color).Println  # CLI color output to stdout.
        - (*github.com/spf13/cobra.Command).MarkFlagRequired  # Only fails if flag name is wrong.

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    # Staticcheck includes SA (staticcheck), S (gosimple), and ST (stylecheck).
    # All three must be explicitly enabled via checks; only SA runs by default.
    staticcheck:
      checks:
        - "all"

    # Complexity limits (Uber recommendations)
    gocyclo:
      min-complexity: 15  # Uber: Keep functions simple

    gocognit:
      min-complexity: 30

    funlen:
      lines: 100  # Uber: Prefer smaller functions
      statements: 50

    nestif:
      min-complexity: 4  # Uber: Avoid deep nesting

    # Code quality
    goconst:
      min-len: 3
      min-occurrences: 3  # Uber: Extract repeated strings
      # Count occurrences in production code only. golangci-lint 2.12.2 started
      # counting _test.go files toward the threshold, and every finding it added
      # was a table-driven test repeating a fixture value: "talos-machineconfig"
      # is 1 occurrence in production and 7 in tests, "ipxe.efi" 2 and 13,
      # "x86_64" 2 and 18. Hoisting those into constants would make the tables
      # assert against the same symbol the code under test uses, so a wrong
      # rename would pass — the literal is the point. Production repetition is
      # still flagged.
      ignore-tests: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
      disabled-checks:
        - whyNoLint  # We prefer explicit nolint comments
        - unnamedResult  # Sometimes okay for simple functions
      settings:
        hugeParam:
          # catalog.Identity (128B) and render.Data (192B) pass by value on
          # purpose: they are immutable request-scoped snapshots, and the
          # by-value API is part of the library contract (ADR-0002).
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 128

    # Testing
    testifylint:
      enable-all: true
      disable:
        - float-compare  # Sometimes we need exact float comparison

    # Style
    nakedret:
      max-func-lines: 5  # Uber: Very limited naked returns

    revive:
      enable-all-rules: false
      rules:
        # Error handling
        - name: error-return
        - name: error-strings
        - name: error-naming

        # Naming conventions
        - name: exported
          arguments: ["disable-stuttering-check"]
        - name: var-naming
        - name: package-comments
        - name: receiver-naming

        # Code organization
        - name: indent-error-flow  # Uber: Handle errors first
        - name: early-return  # Uber: Early returns preferred
        - name: blank-imports
        - name: context-as-argument  # Uber: Context as first param
        - name: context-keys-type  # Uber: Typed context keys
        - name: dot-imports  # Uber: Avoid dot imports

        # Best practices
        - name: constant-logical-expr
        - name: defer  # Uber: Proper defer usage
        - name: empty-block
        - name: identical-branches
        - name: increment-decrement
        - name: range
        - name: range-val-in-closure
        - name: range-val-address
        - name: superfluous-else
        - name: time-naming  # Uber: Duration variable names
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
        - name: var-declaration

        # Performance
        - name: string-of-int  # Uber: Use strconv, not string()

    # Resource management
    nolintlint:
      allow-unused: false
      allow-no-explanation: []
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    rules:
      # Test files can be more lenient
      - path: _test\.go
        linters:
          - errcheck
          - funlen
          - gocyclo
          - gocognit
          - goconst
          - gosec
          - dupl
          - nilnil
          - noctx

      # UDP binds are instantaneous and the ctx-cancellation path closes the
      # conn to unblock reads (see tftp.Serve / proxydhcp.ListenAndServe);
      # threading a ListenConfig adds nothing. The guide also teaches the
      # plain API (docs/go-ipxe chapters 2-3).
      - linters:
          - noctx
        text: "net.ListenPacket"

      # Main files often have init functions
      - path: ./main.go
        linters:
          - gochecknoinits

      # Generated files
      - path: ".*\\.pb\\.go$"
        linters:
          - all

      # Mock files
      - path: mock_.*\.go$
        linters:
          - revive
          - gocritic
          - unparam
          - errcheck
          - nilnil
          - funlen

      # Allow long lines in struct tags
      - linters:
          - lll
        source: "^\\s*\\w+\\s+\\w+\\s+`.*`$"

      - linters:
          - gosec
        text: "G306:"

      # G705 flags request data reaching a response body. httpsrv serves boot
      # scripts and machine configs to firmware and installers (text/plain,
      # yaml, toml), never browser HTML, so the XSS reading does not apply.
      #
      # The reading that DOES apply is template injection: these documents are
      # rendered by text/template, which escapes nothing, so a newline in an
      # identity field can append keys the operator never authored. That is a
      # real defect and gosec was right to point at these sinks — this
      # exclusion previously dismissed it on XSS grounds alone. It is handled
      # at the boundary instead: validateIdentity (httpsrv/httpsrv.go) rejects
      # control characters from every identity source before anything renders.
      # If that guard is removed, re-enable this rule rather than trusting the
      # exclusion.
      - linters:
          - gosec
        text: "G705:"
        path: httpsrv/

      # G304 (file read via a variable path) fires on the boot-asset readers in
      # tftp/ and httpsrv/. Both resolve the request under bootDir with a
      # lexical guard; neither resolves symlinks, so a symlink planted inside
      # the boot directory escapes it. That is the accepted position — the boot
      # directory is operator-curated — and it is stated in
      # docs/go-ipxe/03-tftp-from-scratch.md. Revisit if booty ever serves a
      # directory it does not control.
      - linters:
          - gosec
        text: "G304:"

    paths:
      - vendor
      - third_party
      - testdata
      - examples

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    # Formatting & Imports
    - gofmt  # Uber: Always use gofmt
    - goimports  # Uber: Group and format imports properly
    - gci  # Uber: Deterministic import ordering
    - gofumpt  # Stricter gofmt
    - golines

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/donaldgifford/
    golines:
      max-len: 150
    gci:
      sections:
        - standard  # Standard library
        - default  # Default (third-party)
        - prefix(github.com/donaldgifford)  # Local packages
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
