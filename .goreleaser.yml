---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser config for booty
# Run by .github/workflows/release.yml: merging a PR to main with a
# major/minor/patch label makes pr-semver-bump create the tag, then
# goreleaser releases from it.
version: 2

project_name: booty

builds:
  - id: booty
    main: ./cmd/booty
    binary: booty
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: ["tar.gz"]
    # Apache-2.0 §4(a) requires that recipients of the work get a copy of the
    # licence, and a downloaded tarball is exactly that — a recipient who never
    # sees the repo. goreleaser's default is to include LICENSE/README, and the
    # `none*` idiom that used to be here turned that off, shipping the bare
    # binary. README.md comes along because a tarball with no orientation at all
    # is unkind, and it is 8 kB.
    files:
      - LICENSE
      - README.md

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: 'checksums.txt'

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - '{{ .Env.GPG_FINGERPRINT }}'
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  use: github
  sort: asc
  # Every pattern below tolerates a scope and a breaking-change "!", because
  # this repo scopes nearly every commit. The unscoped forms these started as
  # (`^fix:`, `^chore:`) matched almost nothing, so v0.1.1's notes filed each
  # real fix under "Others" and listed the changelog-regeneration commits that
  # were supposed to be excluded.
  filters:
    exclude:
      - '^docs(\(.+\))?!?:'
      - '^test(\(.+\))?!?:'
      - '^chore(\(.+\))?!?:'
      - '^ci(\(.+\))?!?:'
      - '^style(\(.+\))?!?:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Refactor
      regexp: '^refactor(\(.+\))?!?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 3
    - title: Others
      order: 999

release:
  github:
    owner: donaldgifford
    name: booty
  draft: false
  prerelease: auto
  mode: prepend
  header: |
    ## Release {{ .Tag }} ({{ .Date }})

    ### Installation

    #### Linux/macOS (Manual)
    ```bash
    # Download the appropriate binary for your system
    # Extract and move to your PATH
    tar -xzf booty*.tar.gz
    mv booty ~/.local/bin/
    ```

  footer: |
    ---
    **Full Changelog**: https://github.com/donaldgifford/booty/compare/{{ .PreviousTag }}...{{ .Tag }}

snapshot:
  version_template: '{{ .Tag }}-dev'
